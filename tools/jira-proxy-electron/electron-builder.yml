appId: com.webvibecoding.jira-proxy
productName: Jira Proxy
copyright: WebVibeCoding

directories:
  output: dist-electron
  buildResources: assets

files:
  - dist/**
  - "!dist-electron/**"

extraResources:
  - from: renderer
    to: renderer
  - from: default-config.json
    to: default-config.json

publish:
  provider: github
  owner: trisnguyen2511
  repo: WebVibeCoding
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: jira-proxy-setup.exe

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Jira Proxy
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: jira-proxy-mac.${ext}
  category: public.app-category.developer-tools

dmg:
  title: Jira Proxy

linux:
  target:
    - target: AppImage
      arch: [x64]
  artifactName: jira-proxy-linux.AppImage
  category: Development

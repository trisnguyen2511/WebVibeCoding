<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
  <title>Jira Proxy</title>
  <style>
    :root {
      --bg: #08080E;
      --surface: #0F0F1A;
      --surface2: #13131F;
      --border: #1A1A2E;
      --border2: #23233A;
      --accent: #7C3AED;
      --accent-soft: #A78BFA;
      --accent-dim: rgba(124,58,237,0.12);
      --fg: #FAFAFA;
      --fg2: #C4C4CC;
      --muted: #52525B;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.1);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.1);
      --yellow: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, 'Segoe UI', BlinkMacSystemFont, Inter, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo-box {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── Status card ── */
    .status-card {
      margin: 16px 20px 0;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.3s, background 0.3s;
      flex-shrink: 0;
    }

    .status-card.running {
      border-color: rgba(34,197,94,0.3);
      background: var(--green-dim);
    }

    .status-card.error {
      border-color: rgba(248,113,113,0.3);
      background: var(--red-dim);
    }

    .status-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      flex-shrink: 0;
    }

    .status-card.running .status-icon {
      background: rgba(34,197,94,0.15);
      border-color: rgba(34,197,94,0.25);
    }

    .status-info { flex: 1; min-width: 0; }

    .status-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-card.running .status-label { color: var(--green); }

    .status-value {
      font-size: 13px;
      color: var(--fg2);
      margin-top: 2px;
      font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .health-btn {
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.2);
      color: var(--accent-soft);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 6px;
      display: none;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .health-btn:hover { background: rgba(167,139,250,0.18); }
    .health-btn.visible { display: block; }

    /* ── Form ── */
    .form-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: -4px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }

    .field-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--fg2);
    }

    .field-hint {
      font-size: 10px;
      color: var(--muted);
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--fg);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    input[type="url"],
    input[type="number"],
    input[type="text"] {
      font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
    }

    input[type="password"] {
      letter-spacing: 0.1em;
      padding-right: 38px;
    }

    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,58,237,0.15); }
    input:disabled { opacity: 0.45; cursor: not-allowed; }

    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 14px;
      line-height: 1;
    }
    .toggle-eye:hover { color: var(--fg2); }

    .row-2 { display: flex; gap: 10px; }
    .row-2 .field:first-child { flex: 0 0 100px; }
    .row-2 .field:last-child { flex: 1; }

    /* info box shown when running */
    .proxy-addr {
      display: none;
      padding: 8px 12px;
      background: rgba(34,197,94,0.06);
      border: 1px solid rgba(34,197,94,0.15);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--green);
      text-align: center;
    }
    .proxy-addr.visible { display: block; }

    /* ── Footer / actions ── */
    .footer {
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      letter-spacing: -0.01em;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-start {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(124,58,237,0.35);
    }
    .btn-start:hover:not(:disabled) { opacity: 0.9; }

    .btn-stop {
      background: var(--surface2);
      color: var(--red);
      border: 1px solid rgba(248,113,113,0.25);
    }
    .btn-stop:hover:not(:disabled) { background: var(--red-dim); }

    .footer-note {
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }

    .error-box {
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--red-dim);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 7px;
      color: var(--red);
      font-size: 11px;
      display: none;
      word-break: break-all;
      line-height: 1.5;
    }
    .error-box.visible { display: block; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 0.8s linear infinite; }

    /* Pulse dot */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="logo-box">🔀</div>
    <div class="header-text">
      <h1>Jira Proxy</h1>
      <p>CORS proxy — kết nối Jira nội bộ từ trình duyệt</p>
    </div>
  </header>

  <!-- ── Status ── -->
  <div class="status-card" id="status-card">
    <div class="status-icon" id="status-icon">⚫</div>
    <div class="status-info">
      <div class="status-label" id="status-label">Chưa chạy</div>
      <div class="status-value" id="status-value">Nhập thông tin và bấm Bắt đầu</div>
    </div>
    <button class="health-btn" id="health-btn" onclick="openHealth()">Health ↗</button>
  </div>

  <!-- ── Form ── -->
  <div class="form-body">
    <div class="section-label">Cấu hình kết nối</div>

    <div class="field">
      <div class="field-header">
        <label for="target">Jira URL</label>
        <span class="field-hint">Địa chỉ server Jira của công ty</span>
      </div>
      <input id="target" type="url" placeholder="https://jira.company.com" autocomplete="off" spellcheck="false" />
    </div>

    <div class="field">
      <div class="field-header">
        <label for="token">Personal Access Token</label>
        <span class="field-hint">Không lưu, chỉ dùng khi đang chạy</span>
      </div>
      <div class="input-wrap">
        <input id="token" type="password" placeholder="Dán PAT token vào đây" autocomplete="off" spellcheck="false" />
        <button class="toggle-eye" id="toggle-eye" onclick="toggleEye()" tabindex="-1" title="Hiện/ẩn token">👁</button>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <div class="field-header">
          <label for="port">Port</label>
        </div>
        <input id="port" type="number" value="8765" min="1024" max="65535" />
      </div>
      <div class="field">
        <div class="field-header">
          <label>Địa chỉ proxy</label>
        </div>
        <input id="addr-input" type="text" readonly value="http://127.0.0.1:8765"
          style="cursor:default; color: var(--accent-soft);" />
      </div>
    </div>

    <div class="proxy-addr" id="proxy-addr"></div>
  </div>

  <!-- ── Footer ── -->
  <div class="footer">
    <button class="btn btn-start" id="btn-start" onclick="startProxy()">
      <span>▶</span> Bắt đầu
    </button>
    <button class="btn btn-stop" id="btn-stop" style="display:none" onclick="stopProxy()">
      <span>■</span> Dừng proxy
    </button>
    <div class="error-box" id="error-box"></div>
    <p class="footer-note">Tắt cửa sổ không dừng proxy — app vẫn chạy nền trong system tray</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>

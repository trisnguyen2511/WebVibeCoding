<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
  <title>Jira Proxy</title>
  <style>
    /* ── Design tokens ── */
    :root {
      --bg: #08080E;
      --surface: #0F0F1A;
      --surface2: #13131F;
      --border: #1A1A2E;
      --border2: #23233A;
      --accent: #7C3AED;
      --accent-soft: #A78BFA;
      --accent-dim: rgba(124,58,237,0.12);
      --fg: #FAFAFA;
      --fg2: #C4C4CC;
      --muted: #52525B;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.1);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.1);
      --shadow: none;
    }

    [data-theme="light"] {
      --bg: #F4F4FA;
      --surface: #FFFFFF;
      --surface2: #EBEBF5;
      --border: #DDD8F0;
      --border2: #CBC5E8;
      --accent: #7C3AED;
      --accent-soft: #6D28D9;
      --accent-dim: rgba(124,58,237,0.08);
      --fg: #0A0A14;
      --fg2: #2A2A3C;
      --muted: #7070A0;
      --green: #16a34a;
      --green-dim: rgba(22,163,74,0.08);
      --red: #dc2626;
      --red-dim: rgba(220,38,38,0.08);
      --shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, 'Segoe UI', BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* ── Update banner ── */
    .update-banner {
      display: none;
      padding: 8px 16px;
      background: linear-gradient(90deg, rgba(124,58,237,0.15), rgba(167,139,250,0.1));
      border-bottom: 1px solid rgba(124,58,237,0.25);
      font-size: 12px;
      color: var(--accent-soft);
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .update-banner.visible { display: flex; }
    .update-banner button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .update-banner button:hover { opacity: 0.85; }

    /* ── Header ── */
    .header {
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }

    .logo-box {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .header-text { flex: 1; }
    .header-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .header-text p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .header-actions { display: flex; gap: 6px; }

    .icon-btn {
      background: none;
      border: 1px solid var(--border2);
      color: var(--muted);
      border-radius: 7px;
      width: 30px; height: 30px;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: var(--fg); border-color: var(--accent); background: var(--accent-dim); }

    /* ── Status card ── */
    .status-card {
      margin: 14px 18px 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }
    .status-card.running {
      border-color: rgba(34,197,94,0.35);
      background: var(--green-dim);
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.running {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.2); }
      50%      { box-shadow: 0 0 0 6px rgba(34,197,94,0.05); }
    }

    .status-info { flex: 1; min-width: 0; }
    .status-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .status-card.running .status-label { color: var(--green); }
    .status-value {
      font-size: 12px;
      color: var(--fg2);
      margin-top: 2px;
      font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .health-btn {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      display: none;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .health-btn:hover { background: rgba(34,197,94,0.18); }
    .health-btn.visible { display: block; }

    /* ── Form ── */
    .form-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }

    .field-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--fg2);
    }

    .field-hint {
      font-size: 10px;
      color: var(--muted);
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--fg);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
      box-shadow: var(--shadow);
    }

    input[type="password"] {
      letter-spacing: 0.08em;
      padding-right: 38px;
    }

    input::placeholder { color: var(--muted); font-family: inherit; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,58,237,0.15); }
    input:disabled { opacity: 0.4; cursor: not-allowed; }
    input[readonly] { cursor: default; color: var(--accent-soft); }

    .toggle-eye {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 14px;
      line-height: 1;
      transition: color 0.15s;
    }
    .toggle-eye:hover { color: var(--fg2); }

    .row-2 { display: flex; gap: 10px; }
    .row-2 .field:first-child { flex: 0 0 96px; }
    .row-2 .field:last-child  { flex: 1; }

    /* ── Footer ── */
    .footer {
      padding: 12px 18px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-start {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 14px rgba(124,58,237,0.3);
    }
    .btn-start:hover:not(:disabled) { opacity: 0.9; }

    .btn-stop {
      background: var(--surface2);
      color: var(--red);
      border: 1px solid rgba(248,113,113,0.25);
    }
    .btn-stop:hover:not(:disabled) { background: var(--red-dim); }

    .error-box {
      margin-top: 8px;
      padding: 7px 11px;
      background: var(--red-dim);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 7px;
      color: var(--red);
      font-size: 11px;
      display: none;
      word-break: break-all;
      line-height: 1.5;
    }
    .error-box.visible { display: block; }

    .footer-note {
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }

    /* ── Version chip ── */
    .version-chip {
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: 'SF Mono', 'Consolas', monospace;
      letter-spacing: 0;
    }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 0.7s linear infinite; }
  </style>
</head>
<body>

  <!-- Update banner -->
  <div class="update-banner" id="update-banner">
    <span id="update-text">Có bản cập nhật mới</span>
    <button onclick="openUpdate()">Tải về ↗</button>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="logo-box">🔀</div>
    <div class="header-text">
      <h1>Jira Proxy <span class="version-chip" id="version-chip">v1.1.0</span></h1>
      <p>CORS proxy — kết nối Jira nội bộ từ trình duyệt</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Chuyển theme">🌙</button>
    </div>
  </header>

  <!-- Status -->
  <div class="status-card" id="status-card">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-info">
      <div class="status-label" id="status-label">Chưa chạy</div>
      <div class="status-value" id="status-value">Nhập thông tin và bấm Bắt đầu</div>
    </div>
    <button class="health-btn" id="health-btn" onclick="openHealth()">Health ↗</button>
  </div>

  <!-- Form -->
  <div class="form-body">
    <div class="section-title">Cấu hình kết nối</div>

    <div class="field">
      <div class="field-header">
        <label for="target">Jira URL</label>
        <span class="field-hint">Địa chỉ server Jira của công ty</span>
      </div>
      <input id="target" type="url" placeholder="https://jira.company.com" autocomplete="off" spellcheck="false" />
    </div>

    <div class="field">
      <div class="field-header">
        <label for="token">Personal Access Token (PAT)</label>
        <span class="field-hint">Không lưu — chỉ dùng khi đang chạy</span>
      </div>
      <div class="input-wrap">
        <input id="token" type="password" placeholder="Tùy chọn — để trống nếu dùng Basic Auth" autocomplete="off" spellcheck="false" />
        <button class="toggle-eye" id="toggle-eye" onclick="toggleEye()" tabindex="-1" title="Hiện/ẩn token">👁</button>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <div class="field-header"><label for="port">Port</label></div>
        <input id="port" type="number" value="8765" min="1024" max="65535" />
      </div>
      <div class="field">
        <div class="field-header"><label>Địa chỉ proxy</label></div>
        <input id="addr-input" type="text" readonly value="http://127.0.0.1:8765" />
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn btn-start" id="btn-start" onclick="startProxy()">
      <span>▶</span><span>Bắt đầu</span>
    </button>
    <button class="btn btn-stop" id="btn-stop" style="display:none" onclick="stopProxy()">
      <span>■</span><span>Dừng proxy</span>
    </button>
    <div class="error-box" id="error-box"></div>
    <p class="footer-note">Tắt cửa sổ không dừng proxy — app vẫn chạy nền trong system tray</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>

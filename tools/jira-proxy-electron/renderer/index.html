<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
  <title>Jira Proxy</title>
  <style>
    :root {
      --bg: #08080E;
      --surface: #0F0F1A;
      --border: #1A1A2E;
      --accent: #7C3AED;
      --accent-soft: #A78BFA;
      --fg: #FAFAFA;
      --muted: #52525B;
      --green: #22c55e;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 22px;
      margin-left: 38px;
      margin-top: -2px;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
    }
    .status-bar.running { border-color: rgba(34,197,94,0.3); }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.running { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.5); }

    .status-text { flex: 1; font-size: 13px; color: var(--fg); }
    .status-text.muted { color: var(--muted); }

    .health-btn {
      background: none;
      border: none;
      color: var(--accent-soft);
      font-size: 11px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }
    .health-btn:hover { background: rgba(124,58,237,0.1); }
    .health-btn.visible { display: block; }

    /* Form */
    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="url"],
    input[type="password"],
    input[type="number"],
    input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    input:disabled { opacity: 0.5; cursor: not-allowed; }

    .port-row { display: flex; gap: 10px; align-items: flex-end; }
    .port-row .field { flex: 0 0 90px; }
    .port-row .addr {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      padding-bottom: 10px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-start { background: var(--accent); color: #fff; }
    .btn-start:hover:not(:disabled) { opacity: 0.88; }
    .btn-stop { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
    .btn-stop:hover:not(:disabled) { border-color: var(--red); color: var(--red); }

    .error-box {
      margin-top: 10px;
      padding: 8px 12px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 7px;
      color: var(--red);
      font-size: 12px;
      display: none;
      word-break: break-all;
    }
    .error-box.visible { display: block; }

    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🔀</div>
    <h1>Jira Proxy</h1>
  </header>
  <p class="subtitle">CORS proxy — kết nối Jira nội bộ từ trình duyệt</p>

  <div class="status-bar" id="status-bar">
    <div class="dot" id="dot"></div>
    <span class="status-text muted" id="status-text">Chưa chạy</span>
    <button class="health-btn" id="health-btn" onclick="openHealth()">Health ↗</button>
  </div>

  <div class="field">
    <label>Jira URL</label>
    <input id="target" type="url" placeholder="https://jira.company.com" autocomplete="off" />
  </div>

  <div class="field">
    <label>Personal Access Token (PAT)</label>
    <input id="token" type="password" placeholder="••••••••••••••••••" autocomplete="off" />
  </div>

  <div class="port-row">
    <div class="field">
      <label>Port</label>
      <input id="port" type="number" value="8765" min="1024" max="65535" />
    </div>
    <span class="addr" id="addr">→ http://127.0.0.1:8765</span>
  </div>

  <button class="btn btn-start" id="btn-start" onclick="startProxy()">▶ Bắt đầu</button>
  <button class="btn btn-stop" id="btn-stop" style="display:none" onclick="stopProxy()">■ Dừng proxy</button>

  <div class="error-box" id="error-box"></div>

  <p class="hint">App chạy nền trong system tray — tắt cửa sổ không dừng proxy.</p>

  <script src="renderer.js"></script>
</body>
</html>
